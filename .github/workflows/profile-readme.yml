name: Update README

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-readme.yml'
      - 'templates/README.md.tpl'
  schedule:
    - cron: '0 */6 * * *'

concurrency: profile-readme

permissions:
  contents: write

jobs:
  markscribe:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: muesli/readme-scribe@5a187a2a36ef894335f17a7d01c32b0e28c6d948 # v0.1
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_README_TOKEN }}
        with:
          template: "templates/README.md.tpl"
          writeTo: "README.md"

      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c
        with:
          commit_message: 'Update generated README [skip ci]'
          branch: main
        env:
          GITHUB_TOKEN: ${{ github.token }}
